# XcodeGen spec: `brew install xcodegen && xcodegen generate` produces Waraqa.xcodeproj.
# The .xcodeproj is generated, so edit this file rather than the project in Xcode.
name: Waraqa
options:
  bundleIdPrefix: app.waraqa
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  WaraqaKit:
    path: WaraqaKit

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 525U777XNH
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # https URL of the processing server (backend/). Empty = server tools show "not enabled".
    WARAQA_SERVER_URL: ""
    WARAQA_PRIVACY_POLICY_URL: ""
    WARAQA_SUPPORT_EMAIL: ""

targets:
  Waraqa:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Resources/Waraqa.storekit"
          - "Resources/Fonts/OFL.txt"
      - path: App/Resources/Waraqa.storekit
        buildPhase: none
    dependencies:
      - package: WaraqaKit
        product: WaraqaCore
      - package: WaraqaKit
        product: PDFEngine
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ورقة
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        WaraqaServerURL: $(WARAQA_SERVER_URL)
        WaraqaPrivacyPolicyURL: $(WARAQA_PRIVACY_POLICY_URL)
        WaraqaSupportEmail: $(WARAQA_SUPPORT_EMAIL)
        NSCameraUsageDescription: تستخدم ورقة الكاميرا فقط عندما تختار تصوير مستند لتحويله إلى PDF.
        NSPhotoLibraryAddUsageDescription: تحتاج ورقة هذا الإذن فقط عندما تختار حفظ صورة ناتجة في تطبيق الصور.
        NSFaceIDUsageDescription: تستخدم ورقة Face ID لفتح «مستنداتي» المشفّرة على جهازك فقط.
        UIAppFonts: [Tajawal-Regular.ttf, Tajawal-Medium.ttf, Tajawal-Bold.ttf, Tajawal-ExtraBold.ttf]
        # Files shared to Waraqa are copied in ("Copy to Waraqa"); originals are never edited.
        LSSupportsOpeningDocumentsInPlace: false
        UISupportsDocumentBrowser: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Images
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.jpeg, public.png, public.heic]
          - CFBundleTypeName: Documents
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.openxmlformats.wordprocessingml.document
              - com.microsoft.word.doc
              - org.openxmlformats.presentationml.presentation
              - com.microsoft.powerpoint.ppt
              - org.openxmlformats.spreadsheetml.sheet
              - com.microsoft.excel.xls
              - public.html
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.waraqa.ios
        PRODUCT_NAME: Waraqa
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
      configs:
        # App Store / TestFlight builds are signed in CI with the "Waraqa AppStore" profile
        # (.github/workflows/ci.yml, job "testflight"); Debug keeps automatic signing.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Waraqa AppStore

  WaraqaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
    dependencies:
      - target: Waraqa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.waraqa.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Waraqa

schemes:
  Waraqa:
    build:
      targets:
        Waraqa: all
        WaraqaUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: App/Resources/Waraqa.storekit
    test:
      config: Debug
      targets:
        - WaraqaUITests
        - package: WaraqaKit/WaraqaCoreTests
        - package: WaraqaKit/PDFEngineTests
